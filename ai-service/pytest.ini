[pytest]
# 关键：auto 模式下所有 async def test_* 自动执行，无需逐个加 @pytest.mark.asyncio。
# 背景：tests/test_community_tools.py 的 4 个异步用例（含 3 个租户隔离守卫）此前因缺
# 标记被 pytest 静默跳过（SKIPPED: async def function and no async plugin installed），
# 属于"假绿灯"——测试看似通过，实际从未执行。
asyncio_mode = auto

# 消除 pytest-asyncio 的 fixture loop scope 告警（显式声明而非依赖未来默认值）
asyncio_default_fixture_loop_scope = function

testpaths = tests

# 不在 addopts 里放 -q：verify.sh 需要看到"收集了几个用例、跳过几个"的原始数字，
# 以便判断是否还存在静默跳过。
